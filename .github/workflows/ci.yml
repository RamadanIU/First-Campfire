name: Проверки

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Линтер и форматирование
        run: npm run lint
      - name: Типы
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Дорожная карта
        run: npm run roadmap -- check
      - name: Сборка
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 14
